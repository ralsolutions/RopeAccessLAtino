<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAL · Rope Access Latino Community</title>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root{
      --bg:#0b1220;
      --panel:#111827;
      --panel2:#1f2937;
      --text:#e5e7eb;
      --muted:#9ca3af;
      --accent:#22d3ee;
      --accent2:#67e8f9;
      --border:#334155;
      --ok:#22c55e;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Arial}
    .app{display:grid;grid-template-columns:280px 1fr;height:100vh}
    .sidebar{border-right:1px solid var(--border);background:var(--panel);display:flex;flex-direction:column}
    .brand{padding:16px;border-bottom:1px solid var(--border);font-weight:800}
    .searchWrap{padding:10px;border-bottom:1px solid var(--border)}
    .search{
      width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);
      background:#0f172a;color:var(--text);outline:none;
    }
    .search:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(34,211,238,.15)}
    .cats{padding:8px;overflow:auto;flex:1}
    .cat{margin-bottom:10px}
    .catTitle{font-size:11px;text-transform:uppercase;color:var(--muted);margin:8px 6px}
    .ch{
      width:100%;text-align:left;border:0;background:transparent;color:var(--text);
      padding:8px 10px;border-radius:8px;cursor:pointer;
    }
    .ch:hover{background:#1e293b}
    .ch.active{background:rgba(34,211,238,.15);color:var(--accent2)}
    .main{display:flex;flex-direction:column}
    .header{padding:16px 20px;border-bottom:1px solid var(--border);background:var(--panel)}
    .title{font-size:20px;font-weight:700}
    .desc{font-size:13px;color:var(--muted);margin-top:4px}
    .content{padding:20px;overflow:auto}
    .card{
      background:var(--panel);border:1px solid var(--border);border-radius:12px;
      padding:16px;margin-bottom:12px;
    }
    .card h3{margin:0 0 8px;font-size:16px}
    .meta{font-size:12px;color:var(--muted);margin-bottom:10px}
    .empty{
      border:1px dashed var(--border);border-radius:12px;padding:24px;text-align:center;color:var(--muted)
    }
    .ok{color:var(--ok);font-weight:700}
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useMemo, useState } = React;

const seed = {
  categories: [
    { id: "cat-welcome", name: "Bienvenida", emoji: "👋" },
    { id: "cat-general", name: "General", emoji: "💬" },
    { id: "cat-jobs", name: "Bolsa de Trabajo", emoji: "💼" },
    { id: "cat-tech", name: "Técnico", emoji: "🔧" },
  ],
  channels: [
    { id: "ch-reglas", name: "📋 reglas", categoryId: "cat-welcome", type: "announcement" },
    { id: "ch-presentaciones", name: "👋 presentaciones", categoryId: "cat-welcome", type: "discussion" },
    { id: "ch-noticias", name: "📢 noticias-ral", categoryId: "cat-general", type: "announcement" },
    { id: "ch-charla", name: "💬 charla-general", categoryId: "cat-general", type: "discussion" },
    { id: "ch-market", name: "🛒 marketplace", categoryId: "cat-jobs", type: "marketplace" },
    { id: "ch-irata", name: "🧗 irata-info", categoryId: "cat-tech", type: "discussion" },
    { id: "ch-nudos", name: "🪢 nudos-y-tecnicas", categoryId: "cat-tech", type: "discussion" },
  ],
  posts: {
    "ch-reglas": [
      { id: "p1", title: "Reglas de la comunidad", body: "Respeto, no spam y compartir conocimiento.", author: "Lionel", date: "2026-04-15" }
    ],
    "ch-noticias": [
      { id: "p2", title: "RAL está en línea 🚀", body: "Bienvenidos a la comunidad latina de rope access.", author: "Lionel", date: "2026-04-16" }
    ],
    "ch-charla": [
      { id: "p3", title: "¿De dónde sos?", body: "Contá tu país, nivel IRATA/SPRAT y sector.", author: "Lionel", date: "2026-04-16" }
    ],
    "ch-market": [
      { id: "p4", title: "Oferta: Técnicos en Auckland", body: "Se buscan IRATA L1+ para proyecto de fachada.", author: "Admin", date: "2026-04-17" }
    ]
  }
};

function App(){
  const [filter, setFilter] = useState("");
  const [activeChannelId, setActiveChannelId] = useState("ch-reglas");

  const normalized = filter.trim().toLowerCase();

  const grouped = useMemo(() => {
    return seed.categories.map(cat => {
      const channels = seed.channels
        .filter(c => c.categoryId === cat.id)
        .filter(c => !normalized || c.name.toLowerCase().includes(normalized));
      return { ...cat, channels };
    }).filter(cat => !normalized || cat.channels.length > 0);
  }, [normalized]);

  const activeChannel = seed.channels.find(c => c.id === activeChannelId);
  const posts = seed.posts[activeChannelId] || [];

  return (
    <div className="app">
      <aside className="sidebar">
        <div className="brand">RAL · Rope Access Latino</div>

        <div className="searchWrap">
          <input
            className="search"
            placeholder="Buscar canal..."
            value={filter}
            onChange={(e)=>setFilter(e.target.value)}
          />
        </div>

        <div className="cats">
          {grouped.map(cat => (
            <div className="cat" key={cat.id}>
              <div className="catTitle">{cat.emoji} {cat.name}</div>
              {cat.channels.map(ch => (
                <button
                  key={ch.id}
                  className={"ch " + (activeChannelId === ch.id ? "active" : "")}
                  onClick={()=>setActiveChannelId(ch.id)}
                >
                  {ch.name}
                </button>
              ))}
            </div>
          ))}

          {grouped.length === 0 && (
            <div className="empty">Sin canales para “{filter}”.</div>
          )}
        </div>
      </aside>

      <main className="main">
        <div className="header">
          <div className="title">{activeChannel ? activeChannel.name : "Seleccioná un canal"}</div>
          <div className="desc">Comunidad RAL · Versión estable para copiar/pegar</div>
        </div>

        <div className="content">
          {posts.length === 0 ? (
            <div className="empty">Sin publicaciones todavía.</div>
          ) : (
            posts.map(p => (
              <article className="card" key={p.id}>
                <h3>{p.title}</h3>
                <div className="meta">por {p.author} · {p.date}</div>
                <div>{p.body}</div>
              </article>
            ))
          )}

          <p className="ok">✅ Si ves esta interfaz con colores/estilos, ya está funcionando bien.</p>
        </div>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
