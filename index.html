<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAL · Rope Access Latino Community</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root{
      --bg:#0b1220; --panel:#111827; --panel2:#1f2937; --border:#2b3a50;
      --text:#e5e7eb; --muted:#94a3b8; --accent:#22d3ee; --ok:#22c55e;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,system-ui,Arial;background:var(--bg);color:var(--text)}
    .app{display:grid;grid-template-columns:280px 1fr;height:100vh}
    .sidebar{background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column}
    .brand{padding:16px;font-weight:800;border-bottom:1px solid var(--border)}
    .searchWrap{padding:10px;border-bottom:1px solid var(--border)}
    .search{width:100%;padding:10px;border-radius:10px;border:1px solid var(--border);background:#0f172a;color:var(--text)}
    .search:focus{outline:none;border-color:var(--accent)}
    .cats{padding:8px;overflow:auto;flex:1}
    .catTitle{font-size:11px;color:var(--muted);text-transform:uppercase;margin:10px 6px}
    .ch{width:100%;text-align:left;background:transparent;border:0;color:var(--text);padding:8px 10px;border-radius:8px;cursor:pointer}
    .ch:hover{background:#1e293b}
    .ch.active{background:rgba(34,211,238,.15);color:#67e8f9}
    .userbar{padding:10px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)}
    .main{display:flex;flex-direction:column}
    .header{padding:16px 20px;border-bottom:1px solid var(--border);background:var(--panel)}
    .title{font-size:20px;font-weight:700}
    .desc{font-size:13px;color:var(--muted);margin-top:4px}
    .content{padding:20px;overflow:auto}
    .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px}
    .meta{font-size:12px;color:var(--muted);margin:6px 0 10px}
    .empty{border:1px dashed var(--border);border-radius:12px;padding:20px;text-align:center;color:var(--muted)}
    .btn{background:var(--accent);color:#001018;border:0;padding:10px 14px;border-radius:10px;font-weight:700;cursor:pointer}
    .btnGhost{background:transparent;color:var(--text);border:1px solid var(--border);padding:10px 14px;border-radius:10px;cursor:pointer}
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:20px}
    .modal{width:min(520px,100%);background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px}
    .row{display:flex;gap:10px;align-items:center}
    .input, .select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--border);background:#0f172a;color:var(--text)}
    .ok{background:rgba(34,197,94,.1);border:1px solid var(--ok);color:#d1fae5;border-radius:12px;padding:16px}
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useMemo } = React;

const DB_KEY = "ral_demo_v2";
const load = () => {
  try { return JSON.parse(localStorage.getItem(DB_KEY) || "null"); } catch { return null; }
};
const save = (d) => localStorage.setItem(DB_KEY, JSON.stringify(d));

const seed = {
  user: null,
  categories: [
    { id:"cat-welcome", name:"Bienvenida", emoji:"👋" },
    { id:"cat-general", name:"General", emoji:"💬" },
    { id:"cat-jobs", name:"Bolsa de Trabajo", emoji:"💼" },
    { id:"cat-tech", name:"Técnico", emoji:"🔧" }
  ],
  channels: [
    { id:"ch-reglas", name:"📋 reglas", categoryId:"cat-welcome", type:"announcement" },
    { id:"ch-presentaciones", name:"👋 presentaciones", categoryId:"cat-welcome", type:"discussion" },
    { id:"ch-noticias", name:"📢 noticias-ral", categoryId:"cat-general", type:"announcement" },
    { id:"ch-charla", name:"💬 charla-general", categoryId:"cat-general", type:"discussion" },
    { id:"ch-market", name:"🛒 marketplace", categoryId:"cat-jobs", type:"marketplace" },
    { id:"ch-irata", name:"🧗 irata-info", categoryId:"cat-tech", type:"discussion", private:true }
  ],
  posts: {
    ch_reglas: [],
    "ch-reglas":[{id:"p1",title:"Reglas",body:"Respeto, no spam, compartir conocimiento.",author:"Lionel",date:"2026-04-15"}],
    "ch-noticias":[{id:"p2",title:"RAL está en línea 🚀",body:"Bienvenidos a la comunidad latina de rope access.",author:"Lionel",date:"2026-04-16"}],
    "ch-charla":[{id:"p3",title:"¿De dónde sos?",body:"Contá país, nivel IRATA/SPRAT y sector.",author:"Lionel",date:"2026-04-16"}]
  }
};

function LoginModal({ onLogin }) {
  const [name, setName] = useState("");
  const [role, setRole] = useState("guest");
  return (
    <div className="overlay">
      <div className="modal">
        <h2 style={{marginTop:0}}>Ingreso ficticio RAL</h2>
        <p style={{color:"var(--muted)"}}>Entrá con un nombre para probar la comunidad.</p>
        <div style={{display:"grid",gap:10}}>
          <input className="input" placeholder="Tu nombre" value={name} onChange={e=>setName(e.target.value)} />
          <select className="select" value={role} onChange={e=>setRole(e.target.value)}>
            <option value="guest">Guest</option>
            <option value="member">Member</option>
            <option value="admin">Admin</option>
          </select>
          <button className="btn" onClick={()=>name.trim() && onLogin({name:name.trim(),role,testPassed:false})}>Entrar</button>
        </div>
      </div>
    </div>
  );
}

function TestModal({ onClose, onPass }) {
  return (
    <div className="overlay">
      <div className="modal">
        <h3 style={{marginTop:0}}>📝 Test RAL (ficticio)</h3>
        <p style={{color:"var(--muted)"}}>Este demo aprueba al tocar el botón.</p>
        <div className="row" style={{justifyContent:"flex-end"}}>
          <button className="btnGhost" onClick={onClose}>Cerrar</button>
          <button className="btn" onClick={onPass}>Aprobar test</button>
        </div>
      </div>
    </div>
  );
}

function App(){
  const [state, setState] = useState(()=>load() || seed);
  const [activeChannelId, setActiveChannelId] = useState("ch-reglas");
  const [filter, setFilter] = useState("");
  const [showTest, setShowTest] = useState(false);

  const user = state.user;
  const normalized = filter.trim().toLowerCase();

  const grouped = useMemo(() => {
    return state.categories.map(cat => {
      const channels = state.channels
        .filter(c => c.categoryId === cat.id)
        .filter(c => !normalized || c.name.toLowerCase().includes(normalized));
      return { ...cat, channels };
    }).filter(cat => !normalized || cat.channels.length > 0);
  }, [state.categories, state.channels, normalized]);

  const activeChannel = state.channels.find(c=>c.id===activeChannelId);
  const canView = !activeChannel?.private || user?.role==="admin" || user?.role==="member" || user?.testPassed;
  const posts = state.posts[activeChannelId] || [];

  const updateUser = (u) => {
    const next = { ...state, user:u };
    setState(next); save(next);
  };

  if(!user){
    return <LoginModal onLogin={updateUser} />;
  }

  return (
    <div className="app">
      <aside className="sidebar">
        <div className="brand">RAL · Rope Access Latino</div>
        <div className="searchWrap">
          <input className="search" placeholder="Buscar canal..." value={filter} onChange={e=>setFilter(e.target.value)} />
        </div>
        <div className="cats">
          {grouped.map(cat => (
            <div key={cat.id}>
              <div className="catTitle">{cat.emoji} {cat.name}</div>
              {cat.channels.map(ch => (
                <button key={ch.id} className={"ch " + (activeChannelId===ch.id ? "active":"")} onClick={()=>setActiveChannelId(ch.id)}>
                  {ch.name} {ch.private ? "🔒" : ""}
                </button>
              ))}
            </div>
          ))}
          {grouped.length===0 && <div className="empty">Sin canales para “{filter}”.</div>}
        </div>
        <div className="userbar">
          {user.name} · {user.role} {user.testPassed ? "· ✅ test" : ""}
          <div style={{marginTop:8,display:"flex",gap:8}}>
            {!user.testPassed && <button className="btnGhost" onClick={()=>setShowTest(true)}>Hacer test</button>}
            <button className="btnGhost" onClick={()=>updateUser(null)}>Salir</button>
          </div>
        </div>
      </aside>

      <main className="main">
        <div className="header">
          <div className="title">{activeChannel?.name || "Canal"}</div>
          <div className="desc">Comunidad demo RAL</div>
        </div>
        <div className="content">
          {!canView ? (
            <div className="empty">🔒 Canal privado. Hacé el test o iniciá como member/admin.</div>
          ) : posts.length ? posts.map(p => (
            <article className="card" key={p.id}>
              <h3 style={{margin:"0 0 4px"}}>{p.title}</h3>
              <div className="meta">por {p.author} · {p.date}</div>
              <div>{p.body}</div>
            </article>
          )) : (
            <div className="empty">Sin publicaciones todavía.</div>
          )}

          {user.testPassed && (
            <div className="ok">
              <strong>✅ Perfil recomendado</strong><br />
              Tu perfil está alineado con las necesidades de la industria. Tenés buenas chances de pasar el curso de IRATA (85% de los candidatos lo pasan en el primer intento).
            </div>
          )}
        </div>
      </main>

      {showTest && (
        <TestModal
          onClose={()=>setShowTest(false)}
          onPass={()=>{
            const nextUser = {...user, testPassed:true, role:user.role==="guest" ? "member" : user.role};
            updateUser(nextUser);
            setShowTest(false);
          }}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
